server.address=127.0.0.1
leon.deployments.directory=${LEON_DEPLOYMENTS_DIRECTORY:./data/deployments}
leon.deployments.current-id=${LEON_DEPLOYMENT_ID:}
leon.deployments.enabled=${LEON_DEPLOY_ENABLED:false}
leon.deployments.self-verify=${LEON_DEPLOY_SELF_VERIFY:false}
leon.deployments.control-directory=${LEON_DEPLOY_CONTROL_DIRECTORY:./data/deploy-control}
spring.servlet.multipart.max-file-size=128MB
spring.servlet.multipart.max-request-size=130MB
leon.music.directory=${LEON_MUSIC_DIRECTORY:./data/music}
spring.datasource.url=${LEON_DB_URL:jdbc:h2:file:./data/leon-workflow}
spring.datasource.username=sa
spring.datasource.password=${LEON_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
leon.workflows.credential-key=${LEON_WORKFLOW_CREDENTIAL_KEY:}
leon.workflows.http-allowed-origins=${LEON_WORKFLOW_HTTP_ALLOWED_ORIGINS:}
leon.workflows.scheduling-enabled=${LEON_WORKFLOW_SCHEDULING_ENABLED:true}
leon.agents.helper-enabled=${LEON_AGENT_HELPER_ENABLED:${leon.agents.dispatch-enabled:true}}
leon.agents.helper-agent-id=${LEON_AGENT_HELPER_ID:}
logging.level.org.apache.hc.client5.http.wire=OFF
logging.level.org.apache.hc.client5.http.headers=OFF
leon.plugin.digest-scheduling-enabled=${LEON_PLUGIN_DIGEST_SCHEDULING_ENABLED:false}
leon.alfred.api-key=${LEON_ALFRED_API_KEY:}
leon.youdao.app-key=${YOUDAO_APP_KEY:}
leon.youdao.app-secret=${YOUDAO_APP_SECRET:}
leon.alfred.icons-dir=${LEON_ALFRED_ICONS_DIR:${user.home}/Library/Application Support/Alfred/Alfred.alfredpreferences/workflows/leon_workflow/icons}

# Optional chat push transports. Credentials are read from server-only environment variables.
leon.push.enabled=${LEON_PUSH_ENABLED:false}
leon.push.apns.key-file=${LEON_PUSH_APNS_KEY_FILE:}
leon.push.apns.key-id=${LEON_PUSH_APNS_KEY_ID:}
leon.push.apns.team-id=${LEON_PUSH_APNS_TEAM_ID:}
leon.push.apns.topic=${LEON_PUSH_APNS_TOPIC:com.leon.ios}
leon.push.vivo.app-id=${LEON_PUSH_VIVO_APP_ID:}
leon.push.vivo.app-key=${LEON_PUSH_VIVO_APP_KEY:}
leon.push.vivo.app-secret=${LEON_PUSH_VIVO_APP_SECRET:}
leon.push.vivo.mode=${LEON_PUSH_VIVO_MODE:0}
