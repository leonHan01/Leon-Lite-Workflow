server.address=127.0.0.1
leon.deployments.directory=${LEON_DEPLOYMENTS_DIRECTORY:./data/deployments}
leon.deployments.current-id=${LEON_DEPLOYMENT_ID:}
leon.deployments.enabled=${LEON_DEPLOY_ENABLED:false}
leon.deployments.self-verify=${LEON_DEPLOY_SELF_VERIFY:false}
leon.deployments.control-directory=${LEON_DEPLOY_CONTROL_DIRECTORY:./data/deploy-control}
spring.servlet.multipart.max-file-size=128MB
spring.servlet.multipart.max-request-size=130MB
leon.music.directory=${LEON_MUSIC_DIRECTORY:./data/music}
spring.datasource.url=${LEON_DB_URL:jdbc:h2:file:./data/leon-workflow}
spring.datasource.username=sa
spring.datasource.password=${LEON_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
leon.plugin.digest-scheduling-enabled=${LEON_PLUGIN_DIGEST_SCHEDULING_ENABLED:false}
leon.alfred.api-key=${LEON_ALFRED_API_KEY:}
leon.youdao.app-key=${YOUDAO_APP_KEY:}
leon.youdao.app-secret=${YOUDAO_APP_SECRET:}
leon.alfred.icons-dir=${LEON_ALFRED_ICONS_DIR:${user.home}/Library/Application Support/Alfred/Alfred.alfredpreferences/workflows/leon_workflow/icons}
