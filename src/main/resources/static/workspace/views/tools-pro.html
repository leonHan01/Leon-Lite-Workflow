<div class="workspace-tools-pro-frame">

    <div class="app">
      <nav class="tabs" role="tablist">
        <button class="tab active" type="button" data-tab="collections" role="tab" aria-selected="true">集合</button>
        <button class="tab" type="button" data-tab="tools" role="tab" aria-selected="false">工具</button>
        <button class="tab" type="button" data-tab="notes" role="tab" aria-selected="false">便签</button>
        <button class="tab" type="button" data-tab="todos" role="tab" aria-selected="false">待办</button>

      </nav>

        <p id="sync-status" class="sync-status" hidden></p>

    </div>
    <div id="sheet-root"></div>
    <div id="toast" class="toast" hidden></div>
