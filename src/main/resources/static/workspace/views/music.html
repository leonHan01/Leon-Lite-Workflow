<div class="music-content">
    <div class="music-heading"><div><div class="lw-section-kicker">SONORA · MUSIC LIBRARY</div><h1>把喜欢的歌，放在一起。</h1><p>上传后可在声屿的在线模式中收听，播放过的歌曲也能离线听。</p></div><button type="button" data-refresh>刷新曲库</button></div>
    <details class="music-uploader" data-uploader>
        <summary><span>上传歌曲</span><small>添加新音乐到曲库或歌单</small></summary>
    <form class="music-upload" data-upload>
        <p>支持 MP3、M4A、AAC、WAV、AIFF、CAF 和 FLAC，单首不超过 128 MB。多首歌曲会依次上传。</p>
        <label class="music-files">选择歌曲 <input type="file" name="files" accept=".mp3,.m4a,.aac,.wav,.aif,.aiff,.caf,.flac" multiple required></label>
        <div class="music-fields"><label>艺术家（可选）<input name="artist" maxlength="240" placeholder="未知艺术家"></label><label>专辑（可选）<input name="album" maxlength="240" placeholder="未知专辑"></label><label>上传后加入歌单<select name="playlistId"><option value="">仅上传到曲库</option></select></label><button type="submit">上传到曲库 ↗</button></div>
    </form>
    </details>
    <p class="music-status" data-status role="status" aria-live="polite"></p>
    <div class="music-collection">
        <aside class="music-playlists" aria-label="在线歌单管理">
            <div class="music-playlist-heading"><h2>在线歌单</h2><span>拖拽整理</span></div>
            <form data-create-playlist class="music-playlist-create"><input name="name" placeholder="新歌单名称" maxlength="80" required aria-label="新歌单名称"><button type="submit">创建在线歌单</button></form>
            <button type="button" class="music-all-tracks" data-all-tracks aria-pressed="true">全部在线曲库 <span data-library-count>0</span></button>
            <div class="music-playlist-cards" data-playlist-cards aria-label="歌单拖放目标"></div>
            <p class="music-playlist-empty" data-playlist-empty>先创建一张歌单，再把歌曲拖进来。</p>
            <p class="music-drag-hint" data-drag-hint role="status" aria-live="polite">拖动歌曲到歌单即可加入；勾选多首后，可一起拖入。</p>
        </aside>
        <section class="music-library" aria-label="在线曲库">
            <div class="music-toolbar"><h2><span data-library-title>在线曲库</span> <span data-count></span></h2><input type="search" data-search placeholder="搜索歌曲、艺术家、专辑" aria-label="搜索歌曲"></div>
            <div class="music-playlist-actions"><label>查看 <select data-playlist-filter aria-label="查看歌单"><option value="">全部在线曲库</option></select></label><button type="button" data-rename-playlist disabled>重命名歌单</button><button type="button" data-delete-playlist disabled>删除歌单</button></div>
            <div class="music-playlist-actions"><span data-selection-count>已选 0 首</span><select data-destination aria-label="加入目标歌单"><option value="">选择目标在线歌单</option></select><button type="button" data-add-selected disabled>将所选歌曲加入歌单</button></div>
            <p class="music-playlist-status" data-playlist-status role="status" aria-live="polite"></p>
            <p class="music-order-hint" data-order-hint hidden>上下拖动歌曲调整顺序，松开后自动保存；也可使用 ↑ ↓ 微调。拖到左侧卡片可加入其他歌单。</p>
            <p data-list-status role="status"></p><div class="music-table-wrap"><table class="music-table"><thead><tr><th><input type="checkbox" data-select-all aria-label="全选当前列表"></th><th>歌曲 / 艺术家</th><th>专辑</th><th>大小</th><th>试听</th><th>管理</th></tr></thead><tbody data-tracks></tbody></table></div>
        </section>
    </div>
</div>
