<div class="advanced-page">
    <div class="advanced-eyebrow"><span></span> WORKSPACE SETTINGS</div>
    <h1>高级设置<span>.</span></h1>
    <p class="advanced-intro">管理可用的 AI 模型、工作空间数据与备份。</p>
    <section id="models" class="advanced-card model-settings" aria-labelledby="models-title">
        <div class="advanced-card-body">
            <div class="advanced-kicker">AI MODELS</div>
            <h2 id="models-title">模型配置</h2>
            <button type="button" data-model-refresh>刷新用量</button>
            <div data-model-list></div>
            <form data-model-form class="model-form">
                <h3 data-model-form-title>添加模型</h3>
                <label>显示名称<input name="name" required maxlength="100" placeholder="例如：日常总结 GPT"></label>
                <label>模型服务<select name="provider"><option value="deepseek">DeepSeek</option><option value="openai">OpenAI GPT</option></select></label>
                <label>模型名称<select name="model" required></select></label>
                <label data-model-credential hidden>OpenAI API Key 凭据<select name="credentialId"></select></label>
                <p data-model-key-hint class="advanced-hint">DeepSeek 沿用现有 API Key 配置。</p>
                <label class="model-checkbox"><input name="enabled" type="checkbox" checked>启用此模型</label>
                <div class="model-actions"><button type="submit">保存模型</button><button type="button" data-model-reset>添加新模型</button></div>
            </form>
            <details class="model-key-settings"><summary>添加 OpenAI API Key</summary>
                <form data-model-key-form class="model-form">
                    <label>凭据名称<input name="name" required maxlength="100" placeholder="例如：我的 OpenAI 账户"></label>
                    <label>API Key<input name="apiKey" type="password" required maxlength="8192" autocomplete="new-password" spellcheck="false"></label>
                    <p class="advanced-hint">密钥加密保存，保存后不回显。多个模型可以共用同一凭据；修改已有密钥请到工作流的“管理凭据”。</p>
                    <button type="submit">保存加密凭据</button>
                </form>
            </details>
            <p class="advanced-status" data-model-status role="status" aria-live="polite"></p>
        </div>
    </section>
    <section class="advanced-card" aria-labelledby="backup-title">
        <div class="advanced-card-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v5c0 1.7 3.1 3 7 3s7-1.3 7-3V5M5 10v5c0 1.7 3.1 3 7 3 1.1 0 2.1-.1 3-.3M18 14v7m-3-3 3 3 3-3"/></svg></div>
        <div class="advanced-card-body">
            <div class="advanced-kicker">DATABASE BACKUP</div>
            <h2 id="backup-title">数据库备份</h2>
            <p>一键下载数据库 SQL 脚本，保存当前工作空间的数据和表结构。</p>
            <p class="advanced-hint">备份包含个人数据，请妥善保管。数据库密码和登录会话不会导出。</p>
            <button class="advanced-download" type="button">下载 SQL 备份</button>
            <p class="advanced-status" role="status" aria-live="polite"></p>
        </div>
    </section>
    <footer class="advanced-footer">LEON WORKFLOW</footer>
</div>
